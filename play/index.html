<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rock Run · Campus 54 by NSK AI</title>
<meta name="description" content="Rock Run: dodge and shoot down rocks across the solar system. A Campus 54 by NSK AI game with a global ranking. Plays offline.">
<meta name="theme-color" content="#0A0A12">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/img/icon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icon-180.png">
<link rel="manifest" href="/play/manifest.webmanifest">
<meta property="og:title" content="Rock Run · Campus 54 by NSK AI">
<meta property="og:description" content="Dodge and shoot down rocks across the solar system. Get your name on the board.">
<meta property="og:image" content="https://campus54.nskai.org/assets/img/share.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Urbanist:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play/play.css">
</head>
<body>
<header class="bar">
  <a href="/" class="back" data-t="back">← Back to Campus 54</a>
  <span class="brand">ROCK RUN <small>· CAMPUS 54 by NSK AI</small></span>
</header>

<main class="wrap">
  <div class="stage">
    <canvas id="game" aria-label="Rock Run game"></canvas>
    <div id="hud" class="hud" hidden>
      <span><b data-t="score">SCORE</b> <span id="hs">0</span></span>
      <span id="hl"></span>
      <span class="lives" id="hv"></span>
    </div>

    <section id="menu" class="menu">
      <h1 data-t="title">ROCK RUN</h1>
      <p class="sub" data-t="sub">Dodge and shoot the rocks. Reach Neptune.</p>
      <div id="last" class="last" hidden><span data-t="score">SCORE</span> <b id="lastv">0</b></div>
      <div class="best"><span data-t="best">YOUR BEST</span> <b id="bestv">0</b></div>
      <form id="startform" class="form" novalidate>
        <label><span data-t="nick">Your name</span>
          <input id="nick" maxlength="16" autocomplete="nickname" required></label>
        <button id="playbtn" type="submit" class="play" data-t="play">▶ PLAY</button>
        <p id="msg" class="msg" role="alert"></p>
      </form>
      <p class="how" data-t="how">Move: arrow keys, A/D or drag your finger. Your ship fires by itself.</p>
    </section>
  </div>

  <aside class="boards">
    <p id="sync" class="sync" role="status"></p>
    <p id="pending" class="pending"></p>
    <div class="board"><h2 data-t="players">TOP PLAYERS</h2><ol id="pl"></ol></div>
  </aside>
</main>

<script src="/play/game.js"></script>
</body>
</html>
